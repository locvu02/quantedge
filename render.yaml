# Render deployment config
services:
  - type: web
    name: quantedge-api
    env: python
    buildCommand: pip install -r requirements.txt -r requirements-ml.txt
    startCommand: uvicorn api.main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: quantedge-db
          property: connectionString
      - key: PYTHON_VERSION
        value: "3.11"
      - key: MIN_RISK_REWARD_RATIO
        value: "1.5"
      - key: MAX_RISK_PER_TRADE
        value: "0.02"

databases:
  - name: quantedge-db
    plan: free
