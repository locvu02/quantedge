services:
  - type: web
    name: quantedge-api
    env: python
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn api.main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: PYTHON_VERSION
        value: "3.11"
      - key: DATABASE_URL
        value: "sqlite:///quantedge.db"
      - key: MIN_RISK_REWARD_RATIO
        value: "1.5"
      - key: MAX_RISK_PER_TRADE
        value: "0.02"
